[project]
name = "imsforge"
version = "1.0.0"
description = "Enable VoLTE/VoWiFi/VoNR on Pixel phones for carriers Google never certified, by patching the CarrierSettings protobufs"
readme = "README.md"
authors = [
    { name = "okhsunrog", email = "me@okhsunrog.dev" }
]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "grpcio-tools>=1.83.1",
    "protobuf>=7.36.1",
]

[project.urls]
Homepage = "https://github.com/okhsunrog/imsforge"

[project.scripts]
imsforge = "imsforge:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
