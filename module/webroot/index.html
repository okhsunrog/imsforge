<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>imsforge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="title">
    <h1>imsforge</h1>
    <span class="version" id="version"></span>
  </div>
  <button class="icon" id="refresh" title="Refresh" aria-label="Refresh">↻</button>
</header>

<main>

  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
    <button class="small" id="banner-action"></button>
  </div>

  <section class="card">
    <h2>Your SIM cards</h2>
    <div id="sims"><div class="skeleton"></div></div>
  </section>

  <section class="card">
    <h2>Module</h2>
    <div class="rows" id="status-rows"><div class="skeleton"></div></div>
    <details>
      <summary>Last boot log</summary>
      <pre id="log">—</pre>
    </details>
    <details id="raw-details">
      <summary>Edit configuration as JSON</summary>
      <textarea id="raw" spellcheck="false" rows="12"></textarea>
      <div class="row-actions">
        <span class="error" id="raw-error"></span>
        <button class="small" id="raw-format">Format</button>
      </div>
    </details>
  </section>

</main>

<footer>
  <button class="ghost" id="reboot">Reboot</button>
  <button class="primary" id="save">Save</button>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
