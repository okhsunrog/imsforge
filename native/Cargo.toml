[package]
name = "imsforge"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "On-device CarrierSettings patcher for imsforge"

[dependencies]
# rust-protobuf keeps fields that are not in our schema and writes them back out.
# That matters: Google may add fields to CarrierSettings at any time, and a library
# that drops unknown fields (prost, quick-protobuf) would silently discard them.
protobuf = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
protobuf-codegen = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
